<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Drift Hunters</title>
    <link rel="stylesheet" href="TemplateData/style.css" />
    <script src="TemplateData/UnityProgress.js"></script>
    <script src="Build/UnityLoader.js"></script>
    <script>
      var gameInstance = UnityLoader.instantiate(
        "gameContainer",
        "Build/drift-hunters.json", // Ensure this path is correct
        {
            onProgress: UnityProgress,
            Module: {
                onRuntimeInitialized: function() {
                    UnityProgress(gameInstance, "complete");
                }
            }
        });
    </script>

    <style>
      /* Apply Flexbox to the body */
      body, html {
        margin: 0;
        padding: 0;
        height: 100%;
        width: 100%;
        display: flex;
        align-items: center;  /* Vertically center the game */
        justify-content: center;  /* Horizontally center the game */
        background: #222;  /* Optional background color */
      }

      /* WebGL container */
      .webgl-content {
        display: flex;
        justify-content: center;
        align-items: center;
        width: 100%;
        height: 100%;
      }

      /* Game container filling the entire screen */
      #gameContainer {
        width: 100%;
        height: 100%;
        background-color: black;  /* Optional background color */
      }

      /* Remove footer and other UI elements */
      .footer {
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="webgl-content">
      <div id="gameContainer"></div>
    </div>
  </body>
</html>
