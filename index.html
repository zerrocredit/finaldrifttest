<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Drift Hunters</title>
    <link rel="stylesheet" href="TemplateData/style.css" />
    <script src="TemplateData/UnityProgress.js"></script>
    <script src="Build/UnityLoader.js"></script>
    <script>
      var gameInstance = UnityLoader.instantiate(
        "gameContainer",
        "Build/drift-hunters.json", // Make sure this path is correct
        {
            onProgress: UnityProgress,
            Module: {
                onRuntimeInitialized: function() {
                    UnityProgress(gameInstance, "complete");
                }
            }
        });
    </script>

    <style>
      /* Remove any default margin and padding */
      body, html {
        margin: 0;
        padding: 0;
        height: 100%;
        width: 100%;
      }

      /* Make sure the game container takes up the full viewport */
      .webgl-content {
        height: 100vh; /* Full height of the viewport */
        width: 100vw;  /* Full width of the viewport */
        margin: 0;
        padding: 0;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      /* Optional: Remove footer and other UI elements for fullscreen game */
      .footer {
        display: none;
      }

      #gameContainer {
        width: 100%;
        height: 100%;
        background-color: black; /* Optional: Set a background color */
      }
    </style>
  </head>
  <body>
    <div class="webgl-content">
      <div id="gameContainer"></div>
    </div>
  </body>
</html>
